[project]
name = "automated-swe-jobs"
version = "0.1.0"
description = "Scrapes new-grad SWE and internship postings and alerts users by SMS and email."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "email-validator>=2.2",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    # Resume tailoring uses GA structured outputs (`output_config`) plus
    # Anthropic's server-side web search/fetch tool definitions.
    "anthropic>=0.121",
    "httpx>=0.27",
    "anyio>=4.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
