services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: automated_jobs
      POSTGRES_USER: automated_jobs
      POSTGRES_PASSWORD: automated-jobs-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automated_jobs -d automated_jobs"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - automated_jobs_postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://automated_jobs:automated-jobs-local@postgres:5432/automated_jobs
      AUTH_SECRET: compose-development-secret-change-before-production
      AUTH_COOKIE_SECURE: "false"
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SIGNALWIRE_SPACE: ${SIGNALWIRE_SPACE:-}
      SIGNALWIRE_PROJECT_ID: ${SIGNALWIRE_PROJECT_ID:-}
      SIGNALWIRE_API_TOKEN: ${SIGNALWIRE_API_TOKEN:-}
      SIGNALWIRE_FROM_NUMBER: ${SIGNALWIRE_FROM_NUMBER:-}
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"

volumes:
  automated_jobs_postgres:
